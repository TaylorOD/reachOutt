name: Generate secure Axios lockfile
on:
  pull_request:
    paths:
      - .github/workflows/temporary-lockfile-update.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/axios-vue-frontend-refresh-20261023'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Refresh only the package lockfile to match the Axios minimum
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile to this branch
        run: |
          git diff --stat -- package-lock.json
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Update Axios and transitive lockfile versions'
          git push origin HEAD:refs/heads/security/axios-vue-frontend-refresh-20261023
