name: Twilio webhook signature validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  twilio-authentication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ruby -c app/controllers/twilio_controller.rb
      - run: bundle exec ruby script/security/check_twilio_signature.rb
