name: CodeQL security analysis

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 10 * * 1'

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ruby, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: sarif-results
      - name: Summarize CodeQL findings for review
        shell: bash
        run: |
          if [ -d sarif-results ]; then
            find sarif-results -name '*.sarif' -print0 | while IFS= read -r -d '' sarif; do
              echo "SARIF: $sarif"
              jq -r '.runs[].results[]? | [.ruleId, .level, (.locations[0].physicalLocation.artifactLocation.uri // ""), (.locations[0].physicalLocation.region.startLine // "")] | @tsv' "$sarif" | head -n 100
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: sarif-results
          retention-days: 14
