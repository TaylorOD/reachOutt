name: Bearer token security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bearer-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: ruby -c app/controllers/application_controller.rb
      - run: bundle exec ruby script/security/check_bearer_token.rb .
