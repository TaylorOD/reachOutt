name: Bearer token security checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bearer-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: false
      - run: ruby -c app/controllers/application_controller.rb
      - run: ruby script/security/check_bearer_token.rb .
