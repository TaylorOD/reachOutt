name: Browser tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      PGUSER: postgres
      PGPASSWORD: postgres
      SMS_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: bundle exec rails db:prepare
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start Rails and run browser tests
        run: |
          bundle exec rails server -b 127.0.0.1 -p 3000 > /tmp/reachout-rails.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:3000/up && break
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
