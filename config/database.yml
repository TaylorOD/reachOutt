default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('PGHOST', 'localhost') %>
  port: <%= ENV.fetch('PGPORT', 5432) %>
  username: <%= ENV.fetch('PGUSER', 'postgres') %>
  password: <%= ENV['PGPASSWORD'] %>
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  connect_timeout: 10

development:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  database: reachout_capstone_development

test:
  <<: *default
  database: reachout_capstone_test

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  database: reachout_capstone_production
